<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center Login Card</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    .container {
      width: 320px;
      border: 1px solid black;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background: white;
    }
    .hidden-text {
      visibility: hidden;
      font-size: 0.9rem;
      color: #555;
      margin: 0;
    }
    .card h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }
    .card label,
    .card input {
      display: block;
      width: 100%;
      margin-bottom: 0.8rem;
    }
    .card input {
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .card button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 5px;
      background: #333;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container card">
    <h1>Login</h1>
    <p class="hidden-text">This text is hidden using visibility: hidden.</p>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">
    <button type="button">Sign In</button>
  </div>
</body>
</html>
