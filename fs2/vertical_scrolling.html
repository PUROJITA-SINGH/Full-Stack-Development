<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Scrolling</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .s1 { background: #ff4d4d; }
        .s2 { background: #ff9933; }
        .s3 { background: #ffd633; color: #333; }
        .s4 { background: #33cc66; }
        .s5 { background: #3366ff; }
    </style>
</head>
<body>
    <div class="section s1">1</div>
    <div class="section s2">2</div>
    <div class="section s3">3</div>
    <div class="section s4">4</div>
    <div class="section s5">5</div>
</body>
</html>
