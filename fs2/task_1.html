<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightgray;
        }

        .login-card {
            width: 300px;
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }
        h3{
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login</h2>
        <h3>Username</h3>
        <input type="text" placeholder="Username">
        <h3>Password</h3>
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>
</body>
</html>
