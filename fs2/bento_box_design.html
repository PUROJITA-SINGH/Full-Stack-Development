<!DOCTYPE html>
<html>
<head>
  <title>Bento Box</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: 600px;
      height: 500px;
      padding: 10px;
      background: #e5e7eb;
    }

    .box {
      display: flex;
      align-items: end;
      padding: 10px;
      font-weight: bold;
    }

    .box1 { grid-column: 1 / 3; background: #2563eb; }
    .box2 { grid-column: 3; grid-row: 1 / 3; background: #1f2937; }
    .box3 { grid-column: 1; grid-row: 2 / 4; background: #14b8a6; }
    .box4 { grid-column: 2; background: #f97316; }
    .box5 { grid-column: 2 / 4; background: #8b5cf6; }
    .box6 { grid-column: 2; grid-row: 2 / 4; background: #ec4899; }
  </style>
</head>
<body>
  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
    <div class="box box6">Box 6</div>
  </div>
</body>
</html>
