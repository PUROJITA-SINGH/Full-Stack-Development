<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link {
            color: cadetblue;
            text-decoration: none;
            font-size: 100px;
        }
        a:visited{
                        color: pink;
        }
        a:hover{
            color:burlywood;
            text-shadow: 0 0 5px burlywood, 0 0 10px burlywood, 0 0 20px burlywood;
        }
        a:focus{
            outline: 3px solid burlywood;
            outline-offset: 4px;
        }
        a:active{
            color: darkslateblue;
        }
        
    </style>
</head>
<body>
    <a href="#">Link</a>
</body>
</html>
