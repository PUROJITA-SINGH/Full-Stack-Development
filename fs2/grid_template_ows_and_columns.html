<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        display: grid;
        /* 1) Only repeat:
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 60px);
        */

        /* 2) Repeat with minmax, without auto-fill or auto-fit:
        grid-template-columns: repeat(5, minmax(100px, 1fr));
        grid-template-rows: repeat(5, minmax(60px, auto));
        */

        /* 3) No repeat and no minmax:
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        grid-template-rows: 60px 60px 60px 60px 60px;
        */
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        grid-template-rows: repeat(auto-fill, minmax(60px, auto));
        gap: 4px;
    }
    .container > div {
        outline: 1px dashed #000;
        padding: 8px;
        text-align: center;
    }
    p{
        font-size: 30px;
    }
    
</style>
<body>
    <div class="container">
        <div style="grid-column: 1 / 2; grid-row: 2 / 3;">2</div>
        <div style="grid-column: 2 / 3; grid-row: 2 / 3;">3</div>
        <div style="grid-column: 3 / 4; grid-row: 2 / 3;">4</div>
        <div style="grid-column: 4 / 5; grid-row: 2 / 3;">5</div>
        <div style="grid-column: 5 / 6; grid-row: 2 / 3;">6</div>
        <div style="grid-column: 1 / 2; grid-row: 3 / 4;">2</div>
        <div style="grid-column: 2 / 3; grid-row: 3 / 4;">3</div>
        <div style="grid-column: 3 / 4; grid-row: 3 / 4;">4</div>
        <div style="grid-column: 4 / 5; grid-row: 3 / 4;">5</div>
        <div style="grid-column: 1 / 2; grid-row: 4 / 5;">3</div>
        <div style="grid-column: 2 / 3; grid-row: 4 / 5;">4</div>
        <div style="grid-column: 3 / 4; grid-row: 4 / 5;">5</div>
    </div>
    
    
</body>
</html>
