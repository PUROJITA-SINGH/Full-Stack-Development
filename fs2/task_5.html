<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            display: grid;
            grid-template-rows: 220px;
            margin: 0;
            overflow: hidden;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0002;
        }

        .gallery-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 220px;
            min-width: 0;
            overflow: hidden;
            border-radius: 8px;
            background: hsl(228, 87%, 53%);
            font-size: clamp(2rem, 4vw, 4rem);
            font-weight: bold;
            color: hsl(215, 49%, 85%);
        }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <main class="gallery">
        <div class="gallery-number">1</div>
        <div class="gallery-number">2</div>
        <div class="gallery-number">3</div>
        <div class="gallery-number">4</div>
        <div class="gallery-number">5</div>
        <div class="gallery-number">6</div>
        <div class="gallery-number">7</div>
        <div class="gallery-number">8</div>
        <div class="gallery-number">9</div>
        <div class="gallery-number">10</div>
        <div class="gallery-number">11</div>
        <div class="gallery-number">12</div>
    </main>
</body>
</html>
