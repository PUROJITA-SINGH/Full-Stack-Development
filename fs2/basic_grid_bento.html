<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #f5f7fa 0%, #dfe5eb 28%, #b8bec8 58%, #8d99a6 100%);
        }

        .container {
            display: grid;
            width: min(700px, calc(100vw - 32px));
            height: min(520px, calc(100vh - 32px));

            grid-template-areas:
                "box1 box1 box2 box3 box4"
                "box1 box1 box5 box3 box6"
                "box7 box8 box8 box9 box10"
                "box11 box12 box12 box12 box10";

            gap: 10px;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            padding: 10px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1d2430, #0f1724, #263345);
            box-shadow: 0 20px 45px rgb(18 27 38 / 35%), inset 0 1px rgb(255 255 255 / 20%);
        }

        .container > div {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.35rem;
            color: #f4f7fa;
            border: 1px solid rgb(255 255 255 / 65%);
            border-radius: 14px;
            text-shadow: 0 1px 2px rgb(0 0 0 / 65%);
            box-shadow: inset 0 1px rgb(255 255 255 / 75%), inset 0 -8px 18px rgb(0 0 0 / 18%), 0 4px 10px rgb(0 0 0 / 22%);
            transition: transform 180ms ease, filter 180ms ease;
        }

        .container > div::before {
            content: "";
            position: absolute;
            inset: -40% -20%;
            background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / 8%) 43%, rgb(255 255 255 / 70%) 50%, rgb(255 255 255 / 10%) 57%, transparent 65%);
            transform: translateX(-55%);
            transition: transform 400ms ease;
            pointer-events: none;
        }

        .container > div:hover::before {
            transform: translateX(55%);
        }

        .container > div:nth-child(1) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ef6a8f 18%, #ffbfd1 32%, #d6dfe8 52%, #8e4d65 72%, #f8dedd 100%) !important; }
        .container > div:nth-child(2) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ffb454 18%, #ffd58a 32%, #dfe5ea 52%, #b97930 72%, #fff1c7 100%) !important; }
        .container > div:nth-child(3) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ffd33d 18%, #fff2a8 32%, #dee5eb 52%, #9a7a1d 72%, #ffeab1 100%) !important; }
        .container > div:nth-child(4) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #9ae6a9 18%, #d4ffdd 32%, #dfe7ec 52%, #35a65d 72%, #e4ffe8 100%) !important; }
        .container > div:nth-child(5) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #58d4ff 18%, #d3f4ff 32%, #dfe8f1 52%, #247ae0 72%, #c9f8ff 100%) !important; }
        .container > div:nth-child(6) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #6a9dff 18%, #dfe9ff 32%, #dfe7ee 52%, #3757d3 72%, #dfe8ff 100%) !important; }
        .container > div:nth-child(7) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #7b8cff 18%, #dfe2ff 32%, #e1e7ef 52%, #4d52c6 72%, #eef1ff 100%) !important; }
        .container > div:nth-child(8) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #b987ff 18%, #efd8ff 32%, #e4eaf2 52%, #7147d8 72%, #f5ecff 100%) !important; }
        .container > div:nth-child(9) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ff7ec7 18%, #ffd7ee 32%, #e2e9f0 52%, #ca3671 72%, #ffe8f6 100%) !important; }
        .container > div:nth-child(10) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ff9a5d 18%, #ffe0bf 32%, #e6ebf1 52%, #d96f2d 72%, #ffedd9 100%) !important; }
        .container > div:nth-child(11) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #7ce6b2 18%, #ddffe9 32%, #dfe9ef 52%, #2ca472 72%, #e3fff2 100%) !important; }
        .container > div:nth-child(12) { background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, #ffdd6e 18%, #fff2bb 32%, #dde4ea 52%, #c98a14 72%, #fff5d9 100%) !important; }

        .container > div:hover {
            filter: brightness(1.08);
            transform: scale(1.025);
        }

    </style>
</head>
<body>
    <div class="container">
        <div style="grid-area:box1; background:#ffb3ba;">1</div>
        <div style="grid-area:box2; background:#ffdfba;">2</div>
        <div style="grid-area:box3; background:#ffffba;">3</div>
        <div style="grid-area:box4; background:#baffc9;">4</div>
        <div style="grid-area:box5; background:hsl(206, 78%, 49%);">5</div>
        <div style="grid-area:box6; background:hsl(220, 78%, 60%);">6</div>
        <div style="grid-area:box7; background:hsl(180, 70%, 55%);">7</div>
        <div style="grid-area:box8; background:hsl(280, 60%, 65%);">8</div>
        <div style="grid-area:box9; background:hsl(330, 70%, 65%);">9</div>
        <div style="grid-area:box10; background:hsl(30, 80%, 62%);">10</div>
        <div style="grid-area:box11; background:hsl(120, 60%, 62%);">11</div>
        <div style="grid-area:box12; background:hsl(40, 80%, 68%);">12</div>
    </div>
</body>
</html>
