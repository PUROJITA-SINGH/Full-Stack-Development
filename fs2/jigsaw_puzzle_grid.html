<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Jigsaw Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fdf2d7, #dff6ff);
        }

        .game {
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .board {
            width: 330px;
            height: 330px;
            margin: 0 auto 15px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #c8d6e5;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .tile {
            position: relative;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-image: linear-gradient(135deg, #ffb703, #fb8500, #ff006e, #8338ec, #3a86ff);
            background-size: 300% 300%;
            background-position: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
            transition: transform 0.15s ease;
        }

        .tile:hover {
            transform: scale(1.02);
        }

        .tile.empty {
            background: #dfe6ee;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
            cursor: default;
        }

        .tile.empty::after {
            content: "";
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #2ecc71;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .reset-btn {
            background: #3498db;
        }

        .message {
            margin-top: 15px;
            min-height: 24px;
            color: #2c3e50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game">
        <h1>Easy Jigsaw Puzzle</h1>
        <div id="board" class="board"></div>

        <div class="buttons">
            <button id="shuffleBtn">Shuffle</button>
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        const board = document.getElementById('board');
        const message = document.getElementById('message');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const resetBtn = document.getElementById('resetBtn');

        const solved = [1, 2, 3, 4, 5, 6, 7, 8, 0];
        let puzzle = [...solved];

        function renderBoard() {
            board.innerHTML = '';

            puzzle.forEach((value, index) => {
                const tile = document.createElement('button');
                tile.classList.add('tile');

                if (value === 0) {
                    tile.classList.add('empty');
                    tile.disabled = true;
                } else {
                    tile.textContent = value;
                    tile.addEventListener('click', () => moveTile(index));
                }

                board.appendChild(tile);
            });
        }

        function isValidMove(index) {
            const emptyIndex = puzzle.indexOf(0);
            const row = Math.floor(index / 3);
            const col = index % 3;
            const emptyRow = Math.floor(emptyIndex / 3);
            const emptyCol = emptyIndex % 3;

            const distance = Math.abs(row - emptyRow) + Math.abs(col - emptyCol);
            return distance === 1;
        }

        function moveTile(index) {
            if (!isValidMove(index)) {
                return;
            }

            const emptyIndex = puzzle.indexOf(0);
            [puzzle[index], puzzle[emptyIndex]] = [puzzle[emptyIndex], puzzle[index]];
            renderBoard();
            checkWin();
        }

        function shufflePuzzle() {
            for (let i = 0; i < 200; i++) {
                const emptyIndex = puzzle.indexOf(0);
                const possibleMoves = [];

                const row = Math.floor(emptyIndex / 3);
                const col = emptyIndex % 3;

                if (row > 0) possibleMoves.push(emptyIndex - 3);
                if (row < 2) possibleMoves.push(emptyIndex + 3);
                if (col > 0) possibleMoves.push(emptyIndex - 1);
                if (col < 2) possibleMoves.push(emptyIndex + 1);

                const randomIndex = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                [puzzle[emptyIndex], puzzle[randomIndex]] = [puzzle[randomIndex], puzzle[emptyIndex]];
            }

            if (puzzle.every((value, i) => value === solved[i])) {
                shufflePuzzle();
                return;
            }

            message.textContent = 'Puzzle shuffled!';
            renderBoard();
        }

        function checkWin() {
            if (puzzle.every((value, i) => value === solved[i])) {
                message.textContent = 'You solved it!';
            } else {
                message.textContent = '';
            }
        }

        function resetPuzzle() {
            puzzle = [...solved];
            message.textContent = 'Puzzle reset.';
            renderBoard();
        }

        shuffleBtn.addEventListener('click', shufflePuzzle);
        resetBtn.addEventListener('click', resetPuzzle);

        renderBoard();
    </script>
</body>
</html>
