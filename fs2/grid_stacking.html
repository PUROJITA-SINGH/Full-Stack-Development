<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #edf3ff, #dfeaf9);
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: min(700px, calc(100vw - 32px));
            height: min(520px, calc(100vh - 32px));
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
        }

        .box {
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 12px;
        }

        .box1 { grid-column: 1 / 2; grid-row: 1 / 3; background: #ffb3ba; }
        .box2 { grid-column: 2 / 4; grid-row: 1 / 2; background: #ffdfba; }
        .box3 { grid-column: 2 / 3; grid-row: 2 / 4; background: #ffffba; }
        .box4 { grid-column: 3 / 4; grid-row: 2 / 3; background: #baffc9; }
        .box5 { grid-column: 1 / 2; grid-row: 3 / 4; background: #cfe8ff; }
        .box6 { grid-column: 3 / 4; grid-row: 3 / 4; background: #d7c8ff; }

       


    </style>
</head>
<body>
    <div class="container">
        <div style="grid-area:box1; background:#ffb3ba;">1</div>
        <div style="grid-area:box2; background:#ffdfba;">2</div>
        <div style="grid-area:box3; background:#ffffba;">3</div>
        <div style="grid-area:box4; background:#baffc9;">4</div>
        <div style="grid-area:box5; background:hsl(206, 78%, 49%);">5</div>
        <div style="grid-area:box6; background:hsl(220, 78%, 60%);">6</div>
        <div style="grid-area:box7; background:hsl(180, 70%, 55%);">7</div>
        <div style="grid-area:box8; background:hsl(280, 60%, 65%);">8</div>
        <div style="grid-area:box9; background:hsl(330, 70%, 65%);">9</div>
    </div>
</body>
</html>
