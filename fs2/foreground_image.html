<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .bg {
        position: relative;
        background-image: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        min-height: 420px;
        padding: 120px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #fff;
        overflow: hidden;
        background-attachment: fixed;
    }
    .foreground {
        width: 50%;
        max-width: 500px;
        border: 14px solid black;
        position: relative;
        z-index: 10;
        margin-top: 20px;
        background: rgba(255,255,255,0.8);
    }
    #img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
    }
</style>
<body>
    <div class="bg">
        <h1>Welcome to My Website</h1>
        <h3>Enjoy the beautiful scenery!</h3>
        <div class="foreground">
            <img id="img" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80" alt="Mountain Landscape">
        </div>
    </div>

</body>
</html>
