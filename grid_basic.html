<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Card Layout</title>
  <style>
    .container {
      border: 1px solid black;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3%;
    }
    .card {
        background: #fff;
        border: 1px solid black;
        border-radius: 10px;
        padding: 3%;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);
    }
    .card1 {
        background: yellow;
        border: 1px solid black;
        border-radius: 10px;
        padding: 3%;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);
    }
    .card2 {
        background:blue;
        border: 1px solid black;
        border-radius: 10px;
        padding: 3%;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
        <h1>One</h1>
        <p>NO.one in the world is you.</p>
    </div>
    <div class="card1">
        <h1>Two</h1>
        <p>NO.two in the world is you.</p>
    </div>
    <div class="card2">
        <h1>Three</h1>
    <p>NO.three in the world is you.</p>
    </div>
  </div>
</body>
</html>
