<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        }
    </style>
</head>

    <div class="container">
        <div class="box1">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&q=80" alt="">
        </div>
        <div class="box2">
            <img src="https://images.unsplash.com/photo-1444090542259-0af8fa96557e?w=800&q=80" alt="">
        </div>
    </div>

</html>
